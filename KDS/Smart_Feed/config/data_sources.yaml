sources:
  - source_code: mmcows_multimodal
    source_name: "MmCows: A Multimodal Dataset for Dairy Cattle Monitoring"
    role: ana_omurga_cow_day_multimodal
    priority: A1
    urls:
      landing: "https://github.com/neis-lab/mmcows"
      primary_download: "https://huggingface.co/datasets/neis-lab/mmcows"
      kaggle_mirror: "https://www.kaggle.com/datasets/hienvuvg/mmcows"
    license: "Dataset mirrors list CC BY-NC-SA 4.0; GitHub code is MIT. Verify before production use."
    expected_format: "Large ZIP files; sensor_data.zip, visual_data.zip, optional image/video bundles"
    manual_download_required: true
    download_note: "Large files: sensor_data.zip is about 18 GB, visual_data.zip is about 20 GB; do not auto-download into git workspace."
    target_raw_tables:
      - raw_cow
      - raw_milk
      - raw_sensor
      - raw_environment
      - raw_health
    target_norm_tables:
      - norm_cow_profile
      - norm_milk_daily
      - norm_sensor_daily
      - norm_environment_daily
      - norm_health_event
    target_feature_tables:
      - feat_cow_day_snapshot
      - feat_milk_trend
      - feat_health_risk_label
    target_opt_tables: []
    target_sim_tables:
      - sim_state
    has_animal_id: true
    has_date: true
    has_milk: true
    has_feed: false
    has_feed_ingredient: false
    has_sensor: true
    has_environment: true
    has_health: true
    has_economic_parameter: false
    record_kind: "cow-day / high-frequency sensor snapshot"
    notes: "Birincil cow-day omurga adayıdır. Aynı zaman penceresinde sensör, süt, çevre ve sınırlı sağlık kayıtlarını bağlar."

  - source_code: transition_cow_part2
