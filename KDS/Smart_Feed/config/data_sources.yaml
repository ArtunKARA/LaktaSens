    record_kind: "cow/lactation result or test-day style record"
    notes: "Breed, parity, milk traits and reproduction outcomes ile laktasyon-süt-üreme ilişkisini destekler."

  - source_code: plos_rumiwatch_calving
    source_name: "Assessment of feeding, ruminating and locomotion behaviors in dairy cows around calving"
    role: yardimci_saglik_davranis_risk_verisi
    priority: B2
    urls:
      article: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0264834"
      s1_ration_table: "https://doi.org/10.1371/journal.pone.0264834.s001"
      s2_activity_definitions: "https://doi.org/10.1371/journal.pone.0264834.s002"
      s3_diagnosis_criteria: "https://doi.org/10.1371/journal.pone.0264834.s003"
      s1_raw_data: "https://doi.org/10.1371/journal.pone.0264834.s004"
    license: "PLOS ONE article is CC BY; verify supplementary file reuse terms before production use."
    expected_format: "XLSX + DOCX supplementary files"
    manual_download_required: false
    local_files:
      - "Data/external/plos_rumiwatch_calving/s1_raw_data.xlsx"
      - "Data/external/plos_rumiwatch_calving/s1_ration_table.docx"
      - "Data/external/plos_rumiwatch_calving/s2_activity_definitions.docx"
      - "Data/external/plos_rumiwatch_calving/s3_diagnosis_criteria.docx"
    target_raw_tables:
      - raw_sensor
      - raw_health
      - raw_feed
    target_norm_tables:
      - norm_sensor_daily
      - norm_health_event
      - norm_feeding_daily
    target_feature_tables:
      - feat_health_risk_label
      - feat_feeding_need_label
    target_opt_tables:
      - opt_ration_constraint
    target_sim_tables:
      - sim_reward_parameter
    has_animal_id: false
    has_date: false
    has_milk: false
    has_feed: true
    has_feed_ingredient: false
    has_sensor: true
    has_environment: false
    has_health: true
    has_economic_parameter: false
    record_kind: "group-level result / relative-event window"
    notes: "İndirilen S1 raw data bireysel cow-day değil; grup bazlı mean/SD sonuç yapısında. Risk pencere ve diagnosis kriteri için yardımcı kaynak olarak kullanılmalı."

